about_profile_image: images/IMG_6274.png
about_content: |
    Hello, I'm Morgan Thomas Atkins, a dedicated **Cloud Engineering Evangelist** with a deep-seated passion for guiding enterprises through their digital transformation journeys. My expertise lies at the intersection of **cloud computing, containerization, DevOps practices, and Agentic AI**, where I excel in architecting autonomous, self-healing infrastructure platforms that propel organizations into the future.

    Certified in Docker and with extensive experience in Kubernetes and Rancher, I have a proven track record of designing and deploying scalable, secure, and resilient infrastructure solutions. My skills with HashiCorp Vault, Terraform, and emerging AI-driven automation empower me to build systems that are not only efficient but also intelligent and adaptive.

    I'm particularly excited about the rise of **Agentic AI** in cloud operations - autonomous AI systems that can plan, execute, and learn from infrastructure tasks. This paradigm shift enables self-healing systems, intelligent auto-scaling, and proactive incident response that transforms how we think about DevOps.

    My role goes beyond the technical; as an evangelist, I thrive on sharing knowledge, best practices, and the transformative potential of cloud engineering combined with AI innovation. Through workshops, seminars, and hands-on mentoring, I've inspired teams to embrace cutting-edge technologies.

    **Try the AI assistant** in the bottom right corner to learn more about my experience!

