<!-- Agentic AI Chat Assistant -->
<div id="ai-assistant" class="ai-assistant">
  <div class="ai-toggle" onclick="toggleAI()">
    <div class="ai-pulse"></div>
    <svg class="ai-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/>
      <circle cx="8" cy="14" r="2"/>
      <circle cx="16" cy="14" r="2"/>
    </svg>
  </div>

  <div class="ai-panel">
    <div class="ai-header">
      <div class="ai-status">
        <span class="status-dot"></span>
        <span class="status-text">MORGAN.AI</span>
      </div>
      <button class="ai-close" onclick="toggleAI()">&times;</button>
    </div>

    <div class="ai-messages" id="ai-messages">
      <div class="ai-message bot">
        <div class="message-avatar">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"/>
          </svg>
        </div>
        <div class="message-content">
          <p>Hello! I'm an AI representation of Morgan. Ask me about cloud engineering, DevOps, or my experience!</p>
          <div class="suggested-questions">
            <button onclick="askQuestion('skills')">What are your skills?</button>
            <button onclick="askQuestion('experience')">Tell me about your experience</button>
            <button onclick="askQuestion('agentic')">What is Agentic AI?</button>
          </div>
        </div>
      </div>
    </div>

    <div class="ai-input-container">
      <input type="text" id="ai-input" placeholder="Ask me anything..." onkeypress="handleKeyPress(event)">
      <button class="ai-send" onclick="sendMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </div>
</div>
